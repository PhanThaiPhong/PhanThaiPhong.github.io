<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 13</title>
<style>
  .square {
    width: 100px;
    height: 100px;
    background-color: pink;
    margin: 20px;
    font-size: 24px;
    transition: width 1s, height 1s;
  }

  #square1:hover {
    width: 400px;
  }

  #square2:hover {
    width: 150px;
    height: 150px;
  }
</style>
</head>
<body>
  <div id="square1" class="square">1</div>
  <div id="square2" class="square">2</div>
</body>
</html>
